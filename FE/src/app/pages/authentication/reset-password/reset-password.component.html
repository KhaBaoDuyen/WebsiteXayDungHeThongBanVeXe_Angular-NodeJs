<div class="blank-layout-container justify-content-center align-items-center bg-light">
  <div class="position-relative row w-100 h-100 bg-gredient justify-content-center">
    <div class="col-lg-4 d-flex align-items-center">
      <mat-card class="cardWithShadow boxed-auth">
        <mat-card-content class="p-32">
          <div class="text-center">
            <a [routerLink]="['/']">
              <img src="./assets/images/logos/logo.png" class="align-middle m-2 h-20" alt="logo" />
            </a>
            <h5 class="mt-3">Khôi Phục Mật Khẩu</h5>
            <p class="text-muted">Nhập email để nhận hướng dẫn đặt lại mật khẩu</p>
          </div>

          <form class="m-t-30" [formGroup]="resetForm" (ngSubmit)="resetPassword()">
            <div>
              <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Email</mat-label>
              
              <mat-form-field appearance="outline" class="w-100 mb-0" color="primary">
                <input matInput placeholder="Nhập email của bạn" formControlName="email" />
              </mat-form-field>
            
              <small *ngIf="email?.invalid && email?.touched" class="text-red-500 text-sm leading-tight">
                <span *ngIf="email?.errors?.['required']">Vui lòng nhập email.</span>
                <span *ngIf="email?.errors?.['email']">Email không hợp lệ.</span>
              </small>
            </div>
            
            <button type="submit" mat-flat-button color="primary" class="w-100" [disabled]="resetForm.invalid">
              Gửi yêu cầu
            </button>

            <div class="text-center m-t-16">
              <a [routerLink]="['/auth/login']" class="text-primary">Quay lại đăng nhập</a>
            </div>
          </form>
        </mat-card-content>
      </mat-card>
    </div>
  </div>
</div>
