<div class="blank-layout-container justify-content-center align-items-center bg-light">
    <div class="position-relative row w-100 h-100 bg-gredient justify-content-center">
      <div class="col-lg-4 d-flex align-items-center">
        <mat-card class="cardWithShadow boxed-auth">
          <mat-card-content class="p-32">
            <div class="text-center">
              <a [routerLink]="['/']">
                <img src="./assets/images/logos/logo.png" class="align-middle m-2 h-20" alt="logo" />
              </a>
              <h5 class="mt-3">Đặt Lại Mật Khẩu</h5>
              <p class="text-muted">Nhập mật khẩu mới của bạn bên dưới</p>
            </div>
  
            <form class="m-t-30" [formGroup]="resetForm" (ngSubmit)="submitResetPassword()">
              <div>
                <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Mật khẩu mới</mat-label>
                <mat-form-field appearance="outline" class="w-100 mb-3" color="primary">
                  <input matInput placeholder="Nhập mật khẩu mới" formControlName="password" type="password" />
                </mat-form-field>
                <small *ngIf="password?.invalid && password?.touched" class="text-red-500 text-sm">
                  <span *ngIf="password?.errors?.['required']">Vui lòng nhập mật khẩu mới.</span>
                  <span *ngIf="password?.errors?.['minlength']">Mật khẩu phải có ít nhất 6 ký tự.</span>
                </small>
              </div>
  
              <div>
                <mat-label class="f-s-14 f-w-600 m-b-12 d-block">Xác nhận mật khẩu</mat-label>
                <mat-form-field appearance="outline" class="w-100 mb-0" color="primary">
                  <input matInput placeholder="Xác nhận mật khẩu" formControlName="confirmPassword" type="password" />
                </mat-form-field>
                <small *ngIf="resetForm.hasError('passwordMismatch') && confirmPassword?.touched" class="text-red-500 text-sm">
                  Mật khẩu xác nhận không khớp.
                </small>
              </div>
  
              <button type="submit" mat-flat-button color="primary" class="w-100 mt-3" [disabled]="resetForm.invalid">
                Đặt lại mật khẩu
              </button>
  
              <div class="text-center m-t-16">
                <a [routerLink]="['/auth/login']" class="text-primary">Quay lại đăng nhập</a>
              </div>
            </form>
          </mat-card-content>
        </mat-card>
      </div>
    </div>
  </div>
