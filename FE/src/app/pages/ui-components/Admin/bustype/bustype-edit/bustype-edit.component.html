<main class="flex-1 p-[2rem] bg-white shadow-xl rounded-xl">
    <h2 class="text-2xl font-bold text-gray-800 mb-8 mt-5">Cập nhật loại xe</h2>

    <form  class="space-y-8 p-[20px]">
        <div class="grid grid-cols-1 gap-6 mt-5">
            <div>
                <label class="block font-medium text-gray-700 mb-2">Tên loại xe</label>
                <input type="text" [formControl]="typeName"
                    [ngClass]="{'border-red-500': typeName.invalid && typeName.touched}"
                    class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent transition duration-200">
                <div *ngIf="typeName.invalid && typeName.touched" class="text-red-500 mt-2">
                    <span *ngIf="typeName.errors?.['required']">Tên không được bỏ trống.</span>
                    <span *ngIf="typeName.errors?.['minlength']">Tên phải có ít nhất 5 ký tự.</span>
                </div>
            </div>
        </div>

        <div>
            <label class="block font-medium text-gray-700 mb-2">Trạng Thái</label>
            <select [formControl]="status"
                class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent transition duration-200">
                <option value="active">Hoạt động</option>
                <option value="inactive">Ngừng hoạt động</option>
            </select>
        </div>

        <div>
            <label class="block font-medium  text-gray-700 mb-2">Tổng số ghế</label>
            <input type="text" [formControl]="totalSeat"
              class="w-full px-4 py-3 border border-gray-300 rounded-lg 
              focus:ring-2 focus:ring-orange-500 focus:border-transparent transition duration-200"
              [ngClass]="{ 'border-red-500': totalSeat.invalid && totalSeat.touched }">
              <div *ngIf="totalSeat.invalid && totalSeat.touched" class="text-red-500 mt-2">
                <span *ngIf="totalSeat.errors?.['required']">Tổng số ghế không được bỏ trống.</span>
                <span *ngIf="totalSeat.errors?.['pattern']">Tổng số ghế phải là số.</span>
              </div>
          </div>

        <div class="flex justify-end space-x-4">
            <button type="submit" (click)="onSave()"
                class="px-6 py-3 bg-orange-500 text-white rounded-lg font-semibold hover:bg-orange-600 transition duration-200">
                Cập nhật
            </button>
        </div>
    </form>
</main>
