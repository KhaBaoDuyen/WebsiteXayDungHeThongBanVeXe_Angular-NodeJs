<div class="flex gap-2 justify-between mb-2">
   <h3 class="font-bold text-2xl m-b-10 text-gray-500">Danh sách loại xe buýt</h3>
   <app-form-search (search)="handleSearch($event)"></app-form-search>
</div>

<div  class="bg-white shadow-lg rounded-lg overflow-hidden w-full border-collapse">
   <table mat-table [dataSource]="dataSource" class="w-full border-collapse text-center">
      <ng-container matColumnDef="id">
         <th mat-header-cell *matHeaderCellDef class="bg-gray-200 px-4 py-2 text-gray-700 text-center">ID</th>
         <td mat-cell *matCellDef="let element; let i = index" class="px-4 py-2 text-center">{{ i + 1 }}</td>
      </ng-container>

      <ng-container matColumnDef="typeName">
         <th mat-header-cell *matHeaderCellDef class="bg-gray-200 px-4 py-2 text-gray-700">Tên loại xe</th>
         <td mat-cell *matCellDef="let element" class="px-4 py-2">{{ element.typeName }}</td>
      </ng-container>

      <ng-container matColumnDef="totalSeat">
         <th mat-header-cell *matHeaderCellDef class="bg-gray-200 px-4 py-2 text-gray-700">Số ghế</th>
         <td mat-cell *matCellDef="let element" class="px-4 py-2">{{ element.totalSeat }}</td>
      </ng-container>

      <ng-container matColumnDef="status">
         <th mat-header-cell *matHeaderCellDef class="bg-gray-200 px-4 py-2 text-gray-700">Trạng Thái</th>
         <td mat-cell *matCellDef="let element" class="px-4 py-2">
            <span [ngClass]="{
           'text-green-700 bg-green-200 px-3 p-1 rounded': element.status == 'active',
           'text-red-700 bg-red-200 px-4 py-1 rounded-lg': element.status == 'inactive'
         }">
               {{ element.status ==='active' ? 'Hoạt động' : 'Ngừng hoạt động' }}
            </span>
         </td>
      </ng-container>

      <ng-container matColumnDef="actions">
         <th mat-header-cell *matHeaderCellDef class="bg-gray-200 px-4 py-2 text-gray-700 text-center">Hành động</th>
         <td mat-cell *matCellDef="let element" class="px-4 py-2 flex justify-center space-x-2">
            <a [routerLink]="['/admin/busTypeEdit', element.id]"
               class="m-1 bg-yellow-100 text-yellow-700 px-2 py-2 rounded flex items-center">
               <mat-icon class="text-yellow-700">edit</mat-icon>
            </a>
            <button (click)="openDeleteDialog(element.id)"
            class="m-1 bg-red-100 text-red-700 px-2 py-2 rounded flex items-center"> <mat-icon
                  class="text-red-700">delete</mat-icon>
            </button>
         </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
   </table>


</div>
