<main class="flex-1 bg-white p-[2rem] rounded-xl shadow-xl">
    <h2 class="text-2xl text-gray-800 font-bold mb-8 mt-5">Thông tin tuyến đường</h2>

    <form [formGroup]="routesForm" (ngSubmit)="onSave()" class="p-[20px] space-y-8">
        <div class="">
            <label class="text-gray-700 block font-bold text-xl">Điểm xuất phát</label>
            <div class="flex gap-6 mt-2">
                <div class="flex-1">
                    <label class="text-gray-700 block font-medium mb-2">Tỉnh/Thành phố </label>
                    <select formControlName="startProvince" (change)="onStartProvinceChange()"
                        [ngClass]="{ 'border-red-500': startProvince.invalid && startProvince.touched }"
                        class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-orange-500 focus:border-transparent transition duration-200">
                        <option value="">Chọn Tỉnh/Thành phố</option>
                        <option *ngFor="let province of provinces" [value]="province.ProvinceID">{{
                            province.ProvinceName }}</option>
                    </select>
                    <div *ngIf="startProvince.invalid && startProvince.touched" class="text-red-500 mt-2">
                        <span *ngIf="startProvince.errors?.['required']">Vui lòng chọn tỉnh thành.</span>
                    </div>
                </div>

                <div class="flex-1">
                    <label class="text-gray-700 block font-medium mb-2">Quận/Huyện </label>
                    <select formControlName="startDistrict" (change)="onStartDistrictChange()"
                        [disabled]="!routesForm.value.startProvince"
                        [ngClass]="{ 'border-red-500': startDistrict.invalid && startDistrict.touched }"
                        class="border border-gray-300 rounded-lg w-full px-4 py-3">
                        <option value="">Chọn Quận/Huyện</option>
                        <option *ngFor="let district of startDistricts" [value]="district.DistrictID">{{
                            district.DistrictName }}</option>
                    </select>
                    <div *ngIf="startDistrict.invalid && startDistrict.touched" class="text-red-500 mt-2">
                        <span *ngIf="startDistrict.errors?.['required']">Vui lòng chọn quận huyện.</span>
                    </div>
                </div>

                <div class="flex-1">
                    <label class="text-gray-700 block font-medium mb-2">Xã/Phường </label>
                    <select formControlName="startWard" [disabled]="!routesForm.value.startDistrict"
                        [ngClass]="{ 'border-red-500': startWard.invalid && startWard.touched }"
                        class="border border-gray-300 rounded-lg w-full px-4 py-3">
                        <option value="">Chọn Xã/Phường</option>
                        <option *ngFor="let ward of startWards" [value]="ward.WardCode">{{ ward.WardName }}</option>
                    </select>
                    <div *ngIf="startWard.invalid && startWard.touched" class="text-red-500 mt-2">
                        <span *ngIf="startWard.errors?.['required']">Vui lòng chọn xã phường.</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="">
            <label class="text-gray-700 block font-bold text-xl">Điểm đến</label>
            <div class="flex gap-6 mt-2">
                <div class="flex-1">
                    <label class="text-gray-700 block font-medium mb-2">Tỉnh/Thành phố </label>
                    <select formControlName="endProvince" (change)="onEndProvinceChange()"
                        [ngClass]="{ 'border-red-500': endProvince.invalid && endProvince.touched }"
                        class="border border-gray-300 rounded-lg w-full px-4 py-3">
                        <option value="">Chọn Tỉnh/Thành phố</option>
                        <option *ngFor="let province of provinces" [value]="province.ProvinceID">{{
                            province.ProvinceName }}</option>
                    </select>
                    <div *ngIf="endProvince.invalid && endProvince.touched" class="text-red-500 mt-2">
                        <span *ngIf="endProvince.errors?.['required']">Vui lòng chọn tỉnh thành.</span>
                    </div>
                </div>

                <div class="flex-1">
                    <label class="text-gray-700 block font-medium mb-2">Quận/Huyện </label>
                    <select formControlName="endDistrict" (change)="onEndDistrictChange()"
                        [disabled]="!routesForm.value.endProvince"
                        [ngClass]="{ 'border-red-500': endDistrict.invalid && endDistrict.touched }"
                        class="border border-gray-300 rounded-lg w-full px-4 py-3">
                        <option value="">Chọn Quận/Huyện</option>
                        <option *ngFor="let district of endDistricts" [value]="district.DistrictID">{{
                            district.DistrictName }}</option>
                    </select>
                    <div *ngIf="endDistrict.invalid && endDistrict.touched" class="text-red-500 mt-2">
                        <span *ngIf="endDistrict.errors?.['required']">Vui lòng chọn quận huyện.</span>
                    </div>
                </div>

                <div class="flex-1">
                    <label class="text-gray-700 block font-medium mb-2">Xã/Phường </label>
                    <select formControlName="endWard" [disabled]="!routesForm.value.endDistrict" (change)="calculateRouteDistance()"
                        [ngClass]="{ 'border-red-500': endWard.invalid && endWard.touched }"
                        class="border border-gray-300 rounded-lg w-full px-4 py-3">
                        <option value="">Chọn Xã/Phường</option>
                        <option *ngFor="let ward of endWards" [value]="ward.WardCode">{{ ward.WardName }}</option>
                    </select>
                    <div *ngIf="endWard.invalid && endWard.touched" class="text-red-500 mt-2">
                        <span *ngIf="endWard.errors?.['required']">Vui lòng chọn xã phường.</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="grid grid-cols-2 gap-6 mt-5">
            <div>
                <label class="text-gray-700 block font-medium mb-2">Quảng đường (km)</label>
                <input type="text" formControlName="distance" placeholder="Quảng đường dự kiến km"
                    class="border border-gray-300 rounded-lg w-full duration-200 focus:border-transparent focus:ring-2 focus:ring-orange-500 px-4 py-3 transition">
            </div>
            <div>
                <label class="text-gray-700 block font-medium mb-2">Thời gian dự kiến (giờ)</label>
                <input type="text" formControlName="time" placeholder="Thời gian dự kiến "
                    class="border border-gray-300 rounded-lg w-full duration-200 focus:border-transparent focus:ring-2 focus:ring-orange-500 px-4 py-3 transition">
            </div>
        </div>

        <div class="flex justify-end space-x-4">
            <button type="submit" [disabled]="routesForm.invalid && routesForm.touched" [ngClass]="{
                'bg-orange-500 text-white hover:bg-orange-600': !(routesForm.invalid && routesForm.touched),
                'bg-gray-300 text-gray-500 cursor-not-allowed': routesForm.invalid && routesForm.touched
              }" class="px-6 py-3 rounded-lg font-semibold transition duration-200">
                Lưu thay đổi
            </button>
        </div>

    </form>
</main>
